<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
    <script src="script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Feedback inteligente</title>

</head>

<body>

    <section class="slideshow">

        <img id="banner" src="img/slide1.png">

    </section>

    <section class="camera">

        <h2>Feedback Inteligente</h2>

        <p>
            Ative a câmera e capture uma cena para receber
            feedback automático da IA.
        </p>

        <video id="camera" autoplay></video>

        <canvas id="canvas"></canvas>

        <div class="botoes">

            <button onclick="abrirCamera()">
                Ativar Câmera
            </button>

            <button onclick="capturar()">
                Capturar Cena
            </button>

        </div>

        <div id="resultado">

        </div>

    </section>


</body>

</html>
